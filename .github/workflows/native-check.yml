name: Native desktop check
on:
  pull_request:
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'crates/**'
      - '.github/workflows/native-check.yml'
permissions:
  contents: read
concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-desktop
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Check real desktop IPC and crate integration
        run: cargo check --locked -p shell-ex
