name: Desktop packages
on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this exact master version as a formal release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'xzcode/shell-ex' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether the version changed
        id: plan
        run: python3 scripts/release_desktop.py plan
      - name: Create versioned release draft before building
        id: draft
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_desktop.py prepare ${{ steps.plan.outputs.tag }}
  package:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            name: macOS-Apple-Silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            name: Windows-x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            name: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build desktop installer
        working-directory: apps/desktop
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Native terminal delivery and cleanup tests
        if: runner.os == 'Linux'
        run: cargo test --release --locked --target x86_64-unknown-linux-gnu -p shell-ex --lib terminal_delivery_tests -- --test-threads=1
      - name: Native detached-monitor command permission tests
        if: runner.os == 'Linux'
        run: cargo test --release --locked --target x86_64-unknown-linux-gnu -p shell-ex --lib monitor_window::tests -- --test-threads=1
      - name: Record Linux installer dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for package in target/${{ matrix.target }}/release/bundle/deb/*.deb; do
            dpkg-deb --field "$package" Package Version Architecture Depends
          done
      - name: Verify native macOS signature and architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          apps=(target/aarch64-apple-darwin/release/bundle/macos/*.app)
          test "${#apps[@]}" = 1
          test -d "${apps[0]}"
          binary_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${apps[0]}/Contents/Info.plist")"
          test "$(lipo -archs "${apps[0]}/Contents/MacOS/$binary_name")" = arm64
          codesign --verify --deep --strict "${apps[0]}"
      - name: Stage native installer and checksums
        run: python scripts/release_desktop.py stage ${{ matrix.name }}
      - name: Preserve native installer independently
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ needs.prepare.outputs.tag }}-${{ matrix.name }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 3
      - name: Upload to versioned release draft
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHELL_EX_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: python scripts/release_desktop.py upload ${{ needs.prepare.outputs.tag }}
      - name: Save ordinary development build
        if: needs.prepare.outputs.publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_build.py desktop --target ${{ matrix.target }} --platform ${{ matrix.name }}
  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify all three platform assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHELL_EX_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: python3 scripts/release_desktop.py finalize ${{ needs.prepare.outputs.tag }}
